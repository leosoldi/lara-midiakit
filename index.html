<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Lara Azevedo · UGC Creator | Mídia Kit</title>
    <meta name="description" content="Mídia kit de Lara Azevedo (@azevedo.model) — criadora de conteúdo UGC de beleza, maquiagem e skincare em Curitiba/PR." />
    <!-- ⚠️ TROQUE https://SEU-DOMINIO.com.br PELO ENDERECO REAL DO SITE (3 lugares abaixo).
         Preview de link no WhatsApp/Instagram/Facebook so funciona com URL absoluta:
         caminho relativo aqui faz a imagem nao aparecer. -->
    <link rel="canonical" href="https://SEU-DOMINIO.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lara Azevedo" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://SEU-DOMINIO.com.br/" />
    <meta property="og:title" content="Lara Azevedo · UGC Creator" />
    <meta property="og:description" content="Conteúdos autênticos e estratégicos de beleza, maquiagem e skincare." />
    <meta property="og:image" content="https://SEU-DOMINIO.com.br/media/capa.jpg" />
    <meta property="og:image:width" content="704" />
    <meta property="og:image:height" content="1048" />
    <meta property="og:image:alt" content="Lara Azevedo, criadora de conteúdo UGC" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lara Azevedo · UGC Creator" />
    <meta name="twitter:description" content="Conteúdos autênticos e estratégicos de beleza, maquiagem e skincare." />
    <meta name="twitter:image" content="https://SEU-DOMINIO.com.br/media/capa.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- a imagem do topo e o maior elemento da tela (LCP). Baixar cedo e com
         prioridade alta e o que mais encurta o tempo ate a pagina "aparecer". -->
    <link rel="preload" as="image" href="./media/capa.jpg" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- carrega a folha de fontes sem bloquear a primeira pintura: o navegador
         trata como "print" (baixa prioridade, nao bloqueia) e, ao terminar,
         o onload promove para "all". O <noscript> cobre quem desativou JS. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Manrope:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Manrope:wght@300;400;500;600;700;800&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
